# GitHub Pages / Jekyll site configuration
#
# The "hidden/" folder is kept in this repository for local / reference use,
# but is EXCLUDED from the published site. Files in it are NOT served on the web
# (requesting their URL returns 404). The files still live in the git repo.
#
# Note: setting "exclude" REPLACES Jekyll's default exclude list, so the standard
# defaults are re-listed below to keep the build behaviour unchanged.
# Rewrite relative links to .md files (e.g. inside resources/selfmanagement notes) to the
# URLs of the pages Jekyll generates from them. Whitelisted on GitHub Pages.
plugins:
  - jekyll-relative-links

# Apply the shared note layout to every page under resources/selfmanagement.
defaults:
  - scope:
      path: "resources/selfmanagement"
    values:
      layout: "note"
  # Travel plans: shared note layout, but unlisted — no site links to them and
  # the layout emits a noindex meta tag so search engines skip them.
  - scope:
      path: "resources/travel_plans"
    values:
      layout: "note"
      noindex: true

exclude:
  # --- our private (unpublished) files / folders ---
  - "hidden/"
  - "AGENTS.md"   # agent instructions; never served on the site

  # --- Jekyll default excludes (preserved) ---
  - ".sass-cache"
  - ".jekyll-cache"
  - "gemfiles"
  - "Gemfile"
  - "Gemfile.lock"
  - "node_modules"
  - "vendor/bundle/"
  - "vendor/cache/"
  - "vendor/gems/"
  - "vendor/ruby/"
